<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000}#c{width:100%;height:100%}</style>
<div id="c"></div>
<script>window.RufflePlayer={config:{publicPath:"ruffle/",autoplay:"on",unmuteOverlay:"hidden"}};</script>
<script src="ruffle/ruffle.js"></script>
<script>
addEventListener('load',function(){
  var swf=new URLSearchParams(location.search).get('swf');
  var p=window.RufflePlayer.newest().createPlayer();
  p.style.width='100%';p.style.height='100%';
  document.getElementById('c').appendChild(p);p.load(swf);
});
</script>
